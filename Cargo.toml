[package]
name = "grit"
version = "0.0.0"
license = "MIT"
edition = "2024"
rust-version = "1.88"
publish = false
description = "A sparse-grid stream compaction engine, built on simdr."

[dependencies]
simdr = { path = "../simdr" }
ash = "0.38"
minifb = { version = "0.28", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
minifb = { version = "0.28", default-features = false, features = ["x11"], optional = true }

[dev-dependencies]
ash = "0.38"

[features]
default = ["window"]
window = ["dep:minifb"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = 3
lto = "thin"

[[bin]]
name = "pour"
required-features = ["window"]

[[bin]]
name = "spike"
required-features = ["window"]
