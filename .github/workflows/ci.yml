name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  library:
    name: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grit
      - uses: actions/checkout@v5
        with:
          repository: MerlijnW70/simdr
          path: simdr

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: fmt
        working-directory: grit
        run: cargo fmt --all --check

      - name: clippy-no-window
        working-directory: grit
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --no-default-features --all-targets

      - name: headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcursor-dev libxrandr-dev \
            libxi-dev libx11-dev libgl1-mesa-dev

      - name: clippy
        working-directory: grit
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --all-targets

      - name: doc
        working-directory: grit
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  device:
    name: lavapipe
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vector: 128
            width: 4
            skips: 1
          - vector: 256
            width: 8
            skips: 1
          - vector: 512
            width: 16
            skips: 0
    steps:
      - uses: actions/checkout@v5
        with:
          path: grit
      - uses: actions/checkout@v5
        with:
          repository: MerlijnW70/simdr
          path: simdr
      - uses: dtolnay/rust-toolchain@stable

      - name: lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools

      - name: icd
        run: |
          ls -la /usr/share/vulkan/icd.d/ || true
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
          if [ -z "$icd" ]; then
            echo "::error::no ICD"
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "$icd"

      - name: vulkaninfo
        env:
          LP_NATIVE_VECTOR_WIDTH: ${{ matrix.vector }}
        run: vulkaninfo --summary || true

      - name: test ${{ matrix.width }}
        working-directory: grit
        env:
          LP_NATIVE_VECTOR_WIDTH: ${{ matrix.vector }}
        run: |
          set -o pipefail
          cargo test --release --no-default-features --features deep --no-fail-fast -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/suite.log"
          skipped=$(grep -o 'SKIPPED ' "$RUNNER_TEMP/suite.log" | wc -l)
          echo "$skipped ${{ matrix.skips }}"
          if [ "$skipped" -ne "${{ matrix.skips }}" ]; then
            echo "::error::$skipped != ${{ matrix.skips }}"
            exit 1
          fi

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grit
      - uses: actions/checkout@v5
        with:
          repository: MerlijnW70/simdr
          path: simdr
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - name: check
        working-directory: grit
        run: cargo check --no-default-features --all-targets
