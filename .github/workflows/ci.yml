name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      whole:
        description: Run the whole suite at every width
        type: boolean
        default: true
      base:
        description: Without whole, run the targets the change since this branch can reach
        type: string
        default: main

env:
  CARGO_TERM_COLOR: always
  # The simdr commit every job builds against, and the only place it is
  # recorded. To move it: set the new full SHA here, run the lavapipe test
  # step locally at each width with the environment it sets, and update
  # ci/skips.txt to the counts those runs print.
  SIMDR_REV: 9dec3b766b0ac14c8507a338502cf8b0a37b6136

jobs:
  library:
    name: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grit
      - uses: actions/checkout@v5
        with:
          repository: MerlijnW70/simdr
          ref: ${{ env.SIMDR_REV }}
          path: simdr

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: fmt
        working-directory: grit
        run: cargo fmt --all --check

      - name: clippy-no-window
        working-directory: grit
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --locked --no-default-features --all-targets

      - name: headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcursor-dev libxrandr-dev \
            libxi-dev libx11-dev libgl1-mesa-dev

      - name: clippy
        working-directory: grit
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --locked --all-targets --features faults

      - name: doc
        working-directory: grit
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

      - name: reach
        working-directory: grit
        run: |
          python3 -m unittest discover -s ci -p "test_*.py"
          python3 ci/reach.py check

  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: grit
          fetch-depth: 0
      - name: plan
        id: plan
        working-directory: grit
        env:
          EVENT: ${{ github.event_name }}
          WHOLE: ${{ inputs.whole }}
          BASE: ${{ inputs.base }}
        run: |
          case "$EVENT" in
            pull_request) set -- --base HEAD^1 ;;
            workflow_dispatch)
              if [ "$WHOLE" = "true" ]; then
                set -- --whole
              else
                set -- --base "$(git merge-base "origin/$BASE" HEAD)"
              fi
              ;;
            *) set -- --whole ;;
          esac
          python3 ci/reach.py plan "$@" > "$RUNNER_TEMP/matrix.json"
          cat "$RUNNER_TEMP/matrix.json"
          echo "matrix=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"

  device:
    name: lavapipe ${{ matrix.width }} ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: grit
      - uses: actions/checkout@v5
        with:
          repository: MerlijnW70/simdr
          ref: ${{ env.SIMDR_REV }}
          path: simdr
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools

      - name: icd
        run: |
          ls -la /usr/share/vulkan/icd.d/
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
          if [ -z "$icd" ]; then
            echo "::error::no ICD"
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "$icd"

      - name: vulkaninfo
        env:
          LP_NATIVE_VECTOR_WIDTH: ${{ matrix.vector }}
        run: vulkaninfo --summary

      - name: test ${{ matrix.width }}
        working-directory: grit
        env:
          LP_NATIVE_VECTOR_WIDTH: ${{ matrix.vector }}
          # A software implementation under load is not a card. The default
          # bound of ten seconds is there to catch a hung dispatch, and here a
          # search that is working crosses it: the last run took 2h12m where the
          # one before took 37m, and three suites reported Wedged { after: 10s }.
          GRIT_PATIENCE_SECS: 300
          WORK: ${{ matrix.work }}
          OUT: ${{ runner.temp }}/result-${{ matrix.width }}-${{ strategy.job-index }}.json
        run: python3 -u ci/reach.py run --width ${{ matrix.width }} --work "$WORK" --out "$OUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.width }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/result-${{ matrix.width }}-${{ strategy.job-index }}.json
          if-no-files-found: ignore

  skips:
    name: lavapipe skips
    needs: [plan, device]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grit
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - name: tally
        working-directory: grit
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          printf '%s' "$MATRIX" > "$RUNNER_TEMP/matrix.json"
          python3 ci/reach.py tally --matrix "$RUNNER_TEMP/matrix.json" "$RUNNER_TEMP"/results/*.json

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grit
      - uses: actions/checkout@v5
        with:
          repository: MerlijnW70/simdr
          ref: ${{ env.SIMDR_REV }}
          path: simdr
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - name: check
        working-directory: grit
        run: cargo check --locked --no-default-features --all-targets
