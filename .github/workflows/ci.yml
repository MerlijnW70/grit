name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  library:
    name: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grit
      - uses: actions/checkout@v5
        with:
          repository: MerlijnW70/simdr
          path: simdr

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: fmt
        working-directory: grit
        run: cargo fmt --all --check

      - name: clippy-no-window
        working-directory: grit
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --no-default-features --all-targets

      - name: headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcursor-dev libxrandr-dev \
            libxi-dev libx11-dev libgl1-mesa-dev

      - name: clippy
        working-directory: grit
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --all-targets

      - name: doc
        working-directory: grit
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  device:
    name: lavapipe
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vector: 128
            width: 4
            skips: 9
          - vector: 256
            width: 8
            skips: 1
          - vector: 512
            width: 16
            skips: 0
    steps:
      - uses: actions/checkout@v5
        with:
          path: grit
      - uses: actions/checkout@v5
        with:
          repository: MerlijnW70/simdr
          path: simdr
      - uses: dtolnay/rust-toolchain@stable

      - name: lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools

      - name: icd
        run: |
          ls -la /usr/share/vulkan/icd.d/ || true
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
          if [ -z "$icd" ]; then
            echo "::error::no ICD"
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "$icd"

      - name: vulkaninfo
        env:
          LP_NATIVE_VECTOR_WIDTH: ${{ matrix.vector }}
        run: vulkaninfo --summary || true

      - name: test ${{ matrix.width }}
        working-directory: grit
        env:
          LP_NATIVE_VECTOR_WIDTH: ${{ matrix.vector }}
          # A software implementation under load is not a card. The default
          # bound of ten seconds is there to catch a hung dispatch, and here a
          # search that is working crosses it: the last run took 2h12m where the
          # one before took 37m, and three suites reported Wedged { after: 10s }.
          GRIT_PATIENCE_SECS: 300
        run: |
          set -o pipefail
          cargo test --release --no-default-features --features deep --no-fail-fast -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/suite.log"
          # Counted so that none is a count. `grep` reports no match by
          # failing, `pipefail` hands that on, and `-e` would take the whole
          # step down before the comparison below is ever reached.
          skipped=$({ grep -o 'SKIPPED ' "$RUNNER_TEMP/suite.log" || true; } | wc -l)
          echo "$skipped ${{ matrix.skips }}"
          if [ "$skipped" -ne "${{ matrix.skips }}" ]; then
            echo "::error::$skipped != ${{ matrix.skips }}"
            exit 1
          fi

  # Diagnostic, to be removed: `vast` dies of SIGSEGV on nearly every run
  # when its binary is started by hand, and only now and then under
  # `cargo test`. The runs here keep their output and the last one is run
  # under gdb, so the crash comes back with a place rather than a count.
  vast:
    name: vast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        vector: [128, 256]
    steps:
      - uses: actions/checkout@v5
        with:
          path: grit
      - uses: actions/checkout@v5
        with:
          repository: MerlijnW70/simdr
          path: simdr
      - uses: dtolnay/rust-toolchain@stable

      - name: lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 gdb
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          dpkg -l mesa-vulkan-drivers | tail -1

      - name: build
        working-directory: grit
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: |
          exe=$(cargo test --release --no-default-features --features deep --test vast --no-run             --message-format=json | jq -r 'select(.target.name == "vast" and .executable != null) | .executable')
          echo "VAST=$exe" >> "$GITHUB_ENV"

      - name: look
        working-directory: grit
        env:
          LP_NATIVE_VECTOR_WIDTH: ${{ matrix.vector }}
        run: |
          ulimit -c 0
          once() {
            echo "::group::$*"
            timeout 120 "$VAST" "$@" 2>&1 && rc=0 || rc=$?
            echo "::endgroup::"
            echo "exit $rc :: $*" | tee -a "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          }
          for _ in 1 2 3; do once; done
          for _ in 1 2 3; do once --nocapture; done
          for _ in 1 2 3; do once --test-threads=1 --nocapture; done
          for _ in 1 2 3 4 5; do
            out=$(timeout 300 gdb -q -batch -ex "set pagination off" -ex run               -ex "thread apply all bt 30" --args "$VAST" --nocapture 2>&1 || true)
            if echo "$out" | grep -q SIGSEGV; then
              echo "$out"
              break
            fi
            echo "no crash under gdb"
          done

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grit
      - uses: actions/checkout@v5
        with:
          repository: MerlijnW70/simdr
          path: simdr
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - name: check
        working-directory: grit
        run: cargo check --no-default-features --all-targets
