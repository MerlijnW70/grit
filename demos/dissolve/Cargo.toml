[package]
name = "dissolve"
version = "0.0.0"
license = "MIT"
edition = "2024"
rust-version = "1.88"
publish = false
description = "A picture dissolved by a reversible rule and talked back out of the noise."

[dependencies]
grit = { path = "../.." }
simdr = { path = "../../../simdr" }
minifb = { version = "0.28", default-features = false }

[target.'cfg(unix)'.dependencies]
minifb = { version = "0.28", default-features = false, features = ["x11"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = 3
lto = "thin"
