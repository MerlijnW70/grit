comments = "strict"
tolerance = 0.005
exempt = ["target/**", ".git/**"]

strict_numbers = []

[[benchmarks]]
name = "scale"
command = "cargo run --release --bin scale"
scope = ["src"]
timeout = 1800

[[benchmarks]]
name = "loop_cost"
command = "cargo run --release --bin loop_cost"
scope = ["src/live.rs", "src/resident.rs"]
timeout = 1800

[[benchmarks]]
name = "stages"
command = "cargo run --release --bin stages"
scope = ["src/live.rs", "src/compact.rs", "src/sweep.rs"]
timeout = 1800

[[benchmarks]]
name = "suite"
command = "cargo test --quiet"
scope = ["src", "tests"]
timeout = 1800

[mutation]
command = "noha prober --diff"
pattern = 'killed\s+(?P<killed>[0-9]+)/(?P<total>[0-9]+) viable\s+survivors\s+(?P<survivors>[0-9]+)'
required = 1.0
timeout = 3600
proved = []
